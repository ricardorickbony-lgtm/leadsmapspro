<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LeadMaps Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }
    .title-group h1 {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .title-group p {
      font-size: 10px;
      color: #94a3b8;
    }
    .status-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 11px;
    }
    .status-online {
      color: #10b981;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-offline {
      color: #f59e0b;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    .btn-amber {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
    }
    .btn-amber:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .btn-emerald {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .btn-emerald:hover {
      background: rgba(16, 185, 129, 0.25);
    }
    .counter-display {
      text-align: center;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .counter-display strong {
      color: #f59e0b;
      font-size: 14px;
    }
    .footer {
      text-align: center;
      font-size: 9px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">⚡</div>
    <div class="title-group">
      <h1>LeadMaps Pro</h1>
      <p>Minerador Oficial Google Maps</p>
    </div>
  </div>

  <div id="statusContainer" class="status-box">
    <div class="status-offline">
      <span>●</span> Verificando conexão...
    </div>
  </div>

  <div class="counter-display">
    Comércios na tela: <strong id="leadCount">0</strong>
  </div>

  <button id="btnAutoMine" class="btn btn-amber" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);">
    ⚡ Rastrear Sozinho (35+ Leads)
  </button>

  <button id="btnExtract" class="btn btn-amber">
    🚀 Extrair Leads da Tela
  </button>

  <button id="btnScroll" class="btn btn-secondary">
    ⏬ Rolar e Carregar Mais (+20)
  </button>

  <button id="btnOpenDashboard" class="btn btn-emerald">
    📊 Abrir no Painel LeadMaps Pro
  </button>

  <button id="btnExportCSV" class="btn btn-secondary">
    📥 Baixar Planilha CSV
  </button>

  <div class="footer">
    Padrão Oficial Ricardo & Severino · Custo Zero
  </div>

  <script src="popup.js"></script>
</body>
</html>
